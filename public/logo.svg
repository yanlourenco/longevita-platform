  <circle cx="285" cy="115" r="28" fill="url(#tealGrad)"/>
  <path d="M 285 150 C 330 150 355 190 355 235 C 355 270 325 300 280 325 C 300 290 305 240 285 200 C 270 170 245 160 245 160 C 260 153 272 150 285 150 Z" fill="url(#tealGrad)"/>

  <!-- Center Heart -->
  <path d="M 250 265 C 250 265 210 225 210 195 C 210 175 228 165 242 175 C 250 182 250 186 250 186 C 250 186 250 182 258 175 C 272 165 290 175 290 195 C 290 225 250 265 250 265 Z" fill="url(#heartGrad)"/>

  <!-- Protective Caring Hand (Bottom Arc) -->
  <path d="M 150 260 C 165 315 220 360 275 360 C 320 360 365 330 380 290 C 382 284 374 280 370 285 C 355 310 320 338 275 338 C 225 338 180 298 165 252 C 162 245 148 252 150 260 Z" fill="url(#handGrad)"/>
</svg>
