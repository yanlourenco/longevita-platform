  </defs>

  <!-- Left Green Figure -->
  <circle cx="215" cy="115" r="28" fill="url(#greenGrad)"/>
  <path d="M 215 150 C 170 150 145 190 145 235 C 145 270 175 300 220 325 C 200 290 195 240 215 200 C 230 170 255 160 255 160 C 240 153 228 150 215 150 Z" fill="url(#greenGrad)"/>

